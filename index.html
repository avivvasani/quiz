<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Mavericks | Financial Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary-green: #006400; 
            --correct: #22c55e;
            --wrong: #ef4444;
            --bg: #F9FAF2;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }
        .glass-card {
            background: white;
            border: 2px solid rgba(0, 100, 0, 0.08);
            border-radius: 2rem;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.05);
        }
        .option-btn {
            transition: all 0.2s ease;
            border: 3px solid #f3f4f6;
            background: #fff;
            text-align: left;
            padding: 1.5rem 2rem;
            border-radius: 1.25rem;
            width: 100%;
            font-weight: 700;
            font-size: 1.4rem;
        }
        .option-btn.selected {
            border-color: var(--primary-green);
            background: #f0fdf4;
            box-shadow: 0 0 0 3px var(--primary-green);
        }
        .correct-reveal {
            background-color: var(--correct) !important;
            border-color: #15803d !important;
            color: white !important;
        }
        .wrong-reveal {
            background-color: var(--wrong) !important;
            border-color: #b91c1c !important;
            color: white !important;
        }
        .timer-ring { transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: center; }
        .hidden-element { display: none !important; }
        
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="p-10">

    <!-- START SCREEN -->
    <div id="start-screen" class="fixed inset-0 z-50 bg-white flex items-center justify-center fade-in">
        <div class="text-center p-12 glass-card max-w-3xl w-full mx-auto">
            <h1 class="text-6xl font-black mb-4" style="color: var(--primary-green);">Market Mavericks</h1>
            <p class="text-2xl font-bold text-yellow-600 uppercase tracking-[0.4em] mb-12">Financial Literacy Quiz 2026</p>
            <button onclick="startQuiz()" class="px-16 py-8 bg-green-800 text-white text-3xl font-black rounded-3xl hover:bg-green-900 shadow-2xl transition-all hover:scale-110 active:scale-95">
                BEGIN QUIZ
            </button>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="main-interface" class="max-w-7xl w-full hidden-element fade-in">
        <header class="flex justify-between items-end mb-12 border-b-8 border-green-900 pb-6">
            <div>
                <h1 class="text-6xl font-black tracking-tighter" style="color: var(--primary-green);">Market Mavericks</h1>
                <p id="q-count" class="text-xl font-bold text-gray-500 uppercase tracking-widest mt-1"></p>
            </div>
            <div id="q-type-badge" class="px-6 py-2 bg-yellow-400 text-green-900 text-sm font-black rounded-lg uppercase tracking-widest"></div>
        </header>

        <div class="grid grid-cols-12 gap-12 items-start">
            <div class="col-span-12 lg:col-span-8 space-y-10">
                <div class="glass-card p-12 min-h-[500px] flex flex-col justify-center">
                    <h2 id="q-text" class="text-4xl font-extrabold leading-tight mb-12 text-gray-800"></h2>
                    <div id="options-container" class="grid grid-cols-1 gap-6 hidden-element"></div>
                </div>

                <div class="flex justify-end gap-6 items-center px-4">
                    <div id="feedback-text" class="text-4xl font-black uppercase italic tracking-wider mr-auto"></div>
                    
                    <button id="reveal-btn" class="px-10 py-6 bg-yellow-500 text-yellow-950 text-2xl font-black rounded-2xl hover:bg-yellow-400 shadow-lg transition-all hover:scale-105 active:scale-95">
                        REVEAL OPTIONS
                    </button>

                    <button id="action-btn" class="px-10 py-6 bg-green-800 text-white text-2xl font-black rounded-2xl hover:bg-green-900 shadow-xl transition-all hidden-element hover:scale-105 active:scale-95">
                        LOCK ANSWER
                    </button>
                </div>
            </div>

            <div class="col-span-12 lg:col-span-4">
                <div class="glass-card p-12 text-center">
                    <div class="relative flex items-center justify-center mx-auto mb-8">
                        <svg class="w-56 h-56">
                            <circle class="text-gray-100" stroke-width="12" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
                            <circle id="timer-circle" class="text-gray-200 timer-ring" stroke-width="12" stroke-dasharray="628" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="100" cx="112" cy="112"/>
                        </svg>
                        <span id="timer-text" class="absolute text-7xl font-black text-gray-300">--</span>
                    </div>
                    <p class="text-lg font-black text-gray-400 uppercase tracking-widest">Countdown</p>
                </div>
            </div>
        </div>
    </div>

    <!-- FINAL SCREEN -->
    <div id="end-screen" class="fixed inset-0 z-50 bg-green-900 flex items-center justify-center hidden-element fade-in">
        <div class="text-center p-12 text-white mx-auto">
            <h1 class="text-8xl font-black mb-8">FINISH</h1>
            <p class="text-3xl opacity-80 mb-12 uppercase tracking-widest font-bold">All questions have been completed.</p>
            <button onclick="location.reload()" class="px-16 py-8 bg-white text-green-900 text-3xl font-black rounded-3xl shadow-2xl transition-all hover:scale-110 active:scale-95 hover:bg-gray-100">
                RESTART QUIZ
            </button>
        </div>
    </div>

    <script>
        const fullQuizData = {
            "questions": [
                { "type": "Single Choice", "question": "Which of the following is a primary function of the Reserve Bank of India (RBI)?", "options": ["Issuing passports", "Controlling inflation and money supply", "Collecting income tax", "The oversight and governance of financial markets"], "answer": [1], "timeLimit": 60 },
                { "type": "Single Choice", "question": "If you invest ₹10,000 at a simple interest rate of 10% per year, how much interest earned in 2 years?", "options": ["₹1,000", "₹2,000", "₹2,100", "₹3,000"], "answer": [1], "timeLimit": 60 },
                { "type": "Single Choice", "question": "What does 'inflation' mean in economics?", "options": ["A rise in a country's GDP", "General increase in price of goods and services", "Decrease in total export value", "Increase in government spending"], "answer": [1], "timeLimit": 45 },
                { "type": "Single Choice", "question": "A Fixed Deposit (FD) is best described as:", "options": ["A loan given by a bank to a customer", "Investment locked for a fixed period at fixed interest", "A type of current account", "A government savings scheme for women only"], "answer": [1], "timeLimit": 45 },
                { "type": "Single Choice", "question": "Which document is required to open a bank account in India under KYC norms?", "options": ["Ration card only", "Proof of identity and proof of address", "Tax department tracking card", "Birth certificate"], "answer": [1], "timeLimit": 45 },
                { "type": "Single Choice", "question": "What is a 'budget' in personal finance?", "options": ["A type of bank account", "Plan outlining expected income and expenses", "Timetable for periodic debt payments", "Record for annual tax liability calculation"], "answer": [1], "timeLimit": 60 },
                { "type": "Single Choice", "question": "Which of the following is an example of a liquid asset?", "options": ["Real estate", "5-year Fixed Deposit", "Savings account balance", "Gold jewellery"], "answer": [2], "timeLimit": 45 },
                { "type": "Single Choice", "question": "The BSE SENSEX is:", "options": ["Investment vehicle pooling capital", "Index tracking 30 large companies listed on BSE", "Secure debt instrument issued by the state", "Index representing fifty largest national stocks"], "answer": [1], "timeLimit": 60 },
                { "type": "Single Choice", "question": "What does 'diversification' mean in investing?", "options": ["Putting all your money in one stock", "Spreading investments across assets to reduce risk", "Withdrawing money from multiple banks", "Focusing on sovereign debt instruments"], "answer": [1], "timeLimit": 60 },
                { "type": "Single Choice", "question": "GST (Goods and Services Tax) in India is an example of:", "options": ["A direct tax", "An income tax", "An indirect tax", "A wealth tax"], "answer": [2], "timeLimit": 45 }
            ]
        };

        let currentIdx = 0;
        let timerInterval;
        let timeLeft;
        let currentSelected = [];
        let isValidationState = false;

        const actionBtn = document.getElementById('action-btn');
        const revealBtn = document.getElementById('reveal-btn');
        const feedbackText = document.getElementById('feedback-text');
        const optionsContainer = document.getElementById('options-container');

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden-element');
            document.getElementById('main-interface').classList.remove('hidden-element');
            renderQuestion();
        }

        function renderQuestion() {
            isValidationState = false;
            currentSelected = [];
            feedbackText.innerText = "";
            
            optionsContainer.classList.add('hidden-element');
            revealBtn.classList.remove('hidden-element');
            actionBtn.classList.add('hidden-element');
            actionBtn.innerText = "LOCK ANSWER";
            actionBtn.className = "px-10 py-6 bg-green-800 text-white text-2xl font-black rounded-2xl shadow-xl transition-all hover:scale-105 active:scale-95";
            
            document.getElementById('timer-text').innerText = "--";
            document.getElementById('timer-text').classList.add('text-gray-300');
            document.getElementById('timer-circle').classList.replace('text-green-700', 'text-gray-200');

            const q = fullQuizData.questions[currentIdx];
            document.getElementById('q-text').innerText = q.question;
            document.getElementById('q-type-badge').innerText = q.type;
            document.getElementById('q-count').innerText = `Question ${currentIdx + 1} of ${fullQuizData.questions.length}`;

            optionsContainer.innerHTML = '';
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="mr-6 text-gray-300 font-black">${String.fromCharCode(65 + i)}.</span> ${opt}`;
                btn.onclick = () => { if(!isValidationState) handleSelect(i); };
                optionsContainer.appendChild(btn);
            });
        }

        revealBtn.onclick = () => {
            optionsContainer.classList.remove('hidden-element');
            revealBtn.classList.add('hidden-element');
            actionBtn.classList.remove('hidden-element');
            
            document.getElementById('timer-text').classList.remove('text-gray-300');
            document.getElementById('timer-circle').classList.replace('text-gray-200', 'text-green-700');
            
            startTimer(fullQuizData.questions[currentIdx].timeLimit);
        };

        function handleSelect(idx) {
            const q = fullQuizData.questions[currentIdx];
            if (q.type === "Multiple Choice") {
                if (currentSelected.includes(idx)) {
                    currentSelected = currentSelected.filter(i => i !== idx);
                } else {
                    currentSelected.push(idx);
                }
            } else {
                currentSelected = [idx];
            }
            
            document.querySelectorAll('.option-btn').forEach((b, i) => {
                b.classList.toggle('selected', currentSelected.includes(i));
            });
        }

        function startTimer(duration) {
            clearInterval(timerInterval);
            timeLeft = duration;
            const totalOffset = 628;
            timerInterval = setInterval(() => {
                document.getElementById('timer-text').innerText = timeLeft;
                document.getElementById('timer-circle').style.strokeDashoffset = totalOffset - (timeLeft / duration) * totalOffset;
                if (timeLeft <= 0) { clearInterval(timerInterval); validateChoice(); }
                timeLeft--;
            }, 1000);
        }

        function validateChoice() {
            clearInterval(timerInterval);
            isValidationState = true;
            const q = fullQuizData.questions[currentIdx];
            const btns = document.querySelectorAll('.option-btn');
            
            // For multiple choice, check if sorted arrays match
            const sortedSelected = [...currentSelected].sort();
            const sortedAnswer = [...q.answer].sort();
            const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedAnswer);
            
            feedbackText.innerText = isCorrect ? "✓ Correct" : "✗ Incorrect";
            feedbackText.style.color = isCorrect ? "var(--correct)" : "var(--wrong)";

            btns.forEach((btn, i) => {
                btn.classList.add('pointer-events-none');
                if (q.answer.includes(i)) {
                    btn.classList.add('correct-reveal');
                } else if (currentSelected.includes(i)) {
                    btn.classList.add('wrong-reveal');
                }
            });

            actionBtn.innerText = "Next Round →";
            actionBtn.className = "px-10 py-6 bg-blue-600 text-white text-2xl font-black rounded-2xl shadow-xl transition-all hover:scale-105 active:scale-95";
        }

        actionBtn.onclick = () => {
            if (!isValidationState) {
                if (currentSelected.length === 0) return alert("Select at least one option!");
                validateChoice();
            } else {
                if (currentIdx < fullQuizData.questions.length - 1) {
                    currentIdx++;
                    renderQuestion();
                } else {
                    document.getElementById('main-interface').classList.add('hidden-element');
                    document.getElementById('end-screen').classList.remove('hidden-element');
                }
            }
        };
    </script>
</body>
</html>
